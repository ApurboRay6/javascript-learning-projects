<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://bootswatch.com/4/flatly/bootstrap.min.css" />
    <title>My BookList App</title>
</head>

<body>
    <div class="container mt-4">
        <h1 class="display-4 text-center"><i class="fas fa-book-open text-warning"></i>JavaScript Book
            <span class="text-warning"> List</span> App
        </h1>
        <form id="bookForm">
            <div class="form-group">
                <label for="title">Title :</label>
                <input type="text" id="title" class="form-control" />
                <span class="text-danger" id="errorTitle"></span>
            </div>

            <div class="form-group">
                <label for="author">Author :</label>
                <input type="text" id="author" class="form-control" />
                <span class="text-danger" id="errorAuthor"></span>
            </div>

            <div class="form-group">
                <label for="year">Year</label>
                <input type="number" id="year" class="form-control" />
                <span class="text-danger" id="errorYear"></span>
            </div>
            <input type="submit" value="Add Book" class="btn btn-warning btn-block" id="btn" />
        </form>
        <table class="table table-striped mt-5 text-center">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Year</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="bookList">

            </tbody>
        </table>
    </div>

    <script>
        // DOM Selection

        let bookForm = document.getElementById("bookForm");
        let title = document.getElementById("title");
        let author = document.getElementById("author");
        let year = document.getElementById("year");
        let btn = document.getElementById("btn");
        let booklist = document.getElementById("bookList");

        let errorTitle = document.getElementById("errorTitle");
        let errorAuthor = document.getElementById("errorAuthor");
        let errorYear = document.getElementById("errorYear");


        // Event Listener
        btn.addEventListener("click", function (e) {
            e.preventDefault();
            //    get value  

            let titleVal = title.value;
            let authorVal = author.value;
            let yearVal = year.value;

            // validation check 

            if (titleVal === '' || title.length < 0) {
                errorTitle.innerText = "Enter Your title";
            } else if (authorVal === '') {
                errorAuthor.innerText = "Enter Your author";
            } else if (yearVal === '') {
                errorYear.innerText = "Enter Your year";
            } else {
                // Rest The Form
                bookForm.reset();

                // Button Action
                btnTextInChate();

                // LocalStorage Data Send 
                addNewItem({
                    title: titleVal,
                    author: authorVal,
                    year: yearVal
                });

                // Reload the table form
                window.location.reload();

            }
        });

        // Action button text changes
        function btnTextUpDate() {
            btn.value = "Up Date ";
        }

        function btnTextInChate() {
            btn.value = "Add Book";
        }

        // Store local store with json data
        function addNewItem(item) {
            var myList = JSON.parse(localStorage.getItem("myList")) || [];
            myList.push(item);
            localStorage.setItem("myList", JSON.stringify(myList));
        }

        // Get json ata form localstore
        function getAllItems() {
            return JSON.parse(localStorage.getItem("myList")) || [];
        }

        // Show the all data form localstore
        function displayItems() {
            var items = getAllItems();
            booklist.innerHTML = "";

            items.forEach(function (item, index) {
                const newRow = document.createElement("tr");
                newRow.innerHTML = `
                    <td>${item.title}</td>
                    <td>${item.author}</td>
                    <td>${item.year}</td>
                    <td>
                       <button class="btn btn-warning my-1 editeBtn" onclick="editItem(${index})" >
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>

                        <button class="btn btn-danger mx-2" onclick="deleteItem(${index})">
                            <i class="fa-solid fa-delete-left"></i>
                        </button>
                    </td> 
                `;

                booklist.appendChild(newRow);
            });
        }

        displayItems();

        // Here is Delete item
        function deleteItem(index) {
            let isTrue = confirm("Are you want sure ?");
            if (isTrue == true) {
                var items = getAllItems();
                items.splice(index, 1);
                localStorage.setItem("myList", JSON.stringify(items));
                displayItems();
            }

        }

        function deleteItemByTitle(title) {
            var items = getAllItems();
            items = items.filter(item => item.title !== title);
            localStorage.setItem("myList", JSON.stringify(items));
            displayItems();
        }



    </script>



</body>

</html>
