    <script>
        // DOM Selection
        const bookForm = document.getElementById("bookForm");
        const title = document.getElementById("title");
        const author = document.getElementById("author");
        const year = document.getElementById("year");
        const btn = document.getElementById("btn");
        const booklist = document.getElementById("bookList");

        const errorTitle = document.getElementById("errorTitle");
        const errorAuthor = document.getElementById("errorAuthor");
        const errorYear = document.getElementById("errorYear");

        // Event Listener for Adding Books
        btn.addEventListener("click", function (e) {
            e.preventDefault();

            // Reset error messages
            errorTitle.innerText = "";
            errorAuthor.innerText = "";
            errorYear.innerText = "";

            // get value  
            let titleVal = title.value.trim();
            let authorVal = author.value.trim();
            let yearVal = year.value.trim();

            // validation check 
            if (titleVal === '') {
                errorTitle.innerText = "Enter Your title";
            } else if (authorVal === '') {
                errorAuthor.innerText = "Enter Your author";
            } else if (yearVal === '') {
                errorYear.innerText = "Enter Your year";
            } else {
                // Create Table Row 
                const newRow = document.createElement("tr");


                newRow.innerHTML = `
                <td>${titleVal}</td>
                <td>${authorVal}</td>
                <td>${yearVal}</td>
                <td>
                    <button class="btn btn-warning my-1 editBtn">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button class="btn btn-danger mx-2 deleteBtn">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                </td>
            `; ~

                    booklist.appendChild(newRow);
                bookForm.reset();
            }
        });


        booklist.addEventListener("click", function (e) {

            const target = e.target;

            // DELETE FUNCTIONALITY
            if (target.closest(".deleteBtn")) {
                if (confirm("Are you sure you want to delete?")) {
                    const row = target.closest("tr");
                    row.remove();
                }
            }

            // EDIT FUNCTIONALITY (Optional Bonus)
            if (target.closest(".editBtn")) {
                const row = target.closest("tr");
                const cells = row.querySelectorAll("td");

                title.value = cells[0].innerText;
                author.value = cells[1].innerText;
                year.value = cells[2].innerText;


                row.remove();
            }
        });
    </script>
